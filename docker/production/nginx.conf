# nginx inside the Ada image: serves the built assets and passes everything
# else to PHP-FPM. TLS terminates at the reverse proxy in front of the
# container (docs/deployment.md).

worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /dev/stdout;
    server_tokens off;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;

    client_body_temp_path /tmp/nginx-client-body;
    fastcgi_temp_path /tmp/nginx-fastcgi;
    proxy_temp_path /tmp/nginx-proxy;
    uwsgi_temp_path /tmp/nginx-uwsgi;
    scgi_temp_path /tmp/nginx-scgi;

    # Logo and favicon uploads are at most 1 MB.
    client_max_body_size 4m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    server {
        listen 8080 default_server;
        root /app/public;
        index index.php;
        charset utf-8;

        # Built assets have content hashes in their names.
        location /build/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location = /favicon.ico { access_log off; log_not_found off; }
        location = /robots.txt  { access_log off; log_not_found off; }

        location ~ ^/index\.php(/|$) {
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            include fastcgi_params;
            fastcgi_hide_header X-Powered-By;

            # Response headers include the asset preload links and the
            # security policy: more than nginx's default 4-8 KB.
            fastcgi_buffer_size 32k;
            fastcgi_buffers 16 16k;

            # Chat answers are streamed (server-sent events): the response
            # carries X-Accel-Buffering: no, and may take as long as the
            # provider timeout (ADA_PROVIDER_TIMEOUT, 300 s) plus margin.
            fastcgi_read_timeout 420s;
        }

        location ~ \.php$ { return 404; }

        location ~ /\.(?!well-known) { deny all; }
    }
}
