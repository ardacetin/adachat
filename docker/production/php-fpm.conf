; Ada PHP-FPM pool. Every streaming chat answer holds one worker until it
; ends, so max_children is the number of answers that can stream at once
; plus headroom for page requests (docs/deployment.md, "Sizing").

[global]
error_log = /proc/self/fd/2
log_limit = 8192
daemonize = no

[www]
listen = 127.0.0.1:9000
; Workers start when requests arrive and stop after a minute idle.
pm = ondemand
pm.max_children = ${PHP_FPM_MAX_CHILDREN}
pm.process_idle_timeout = 60s
pm.max_requests = 1000
; Laravel logs to stderr: pass it through whole, one JSON line per entry.
catch_workers_output = yes
decorate_workers_output = no
clear_env = no
access.log = /dev/null
