; Ada PHP-FPM pool. Every streaming chat answer holds one worker until it
; ends, so max_children is the number of answers that can stream at once
; plus headroom for page requests (docs/deployment.md, "Sizing").

[global]
error_log = /proc/self/fd/2
log_limit = 8192
daemonize = no

[www]
listen = 127.0.0.1:9000
; Workers start when requests arrive and stop after a minute idle.
pm = ondemand
pm.max_children = ${PHP_FPM_MAX_CHILDREN}
pm.process_idle_timeout = 60s
pm.max_requests = 1000
; A wall-clock bound on every request: a provider that drips its headers or
; chunk framing never reaches Ada's own deadline check. Keep it at
; ADA_PROVIDER_TIMEOUT + 120 (the reservation's grace), so a held worker is
; ended when its reservation expires (docs/deployment.md, "Sizing").
request_terminate_timeout = ${PHP_FPM_REQUEST_TERMINATE_TIMEOUT}
; Laravel logs to stderr: pass it through whole, one JSON line per entry.
catch_workers_output = yes
decorate_workers_output = no
clear_env = no
access.log = /dev/null
