; Ada production PHP settings (on top of the image defaults).
expose_php = Off
memory_limit = 256M
; Chat answers stream for up to ADA_PROVIDER_TIMEOUT seconds; the request
; extends its own limit (MessageController), other requests stay short.
max_execution_time = 60
; Chat attachments are at most 10 MB (PDF and Office files).
upload_max_filesize = 11M
post_max_size = 12M
display_errors = Off
log_errors = On
error_log = /proc/self/fd/2

; The image is immutable: never check files for changes.
opcache.enable = 1
opcache.validate_timestamps = 0
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
realpath_cache_size = 4096K
realpath_cache_ttl = 600

session.cookie_httponly = 1
