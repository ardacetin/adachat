# nginx site for Ada Chat on a server without Docker (docs/deployment.md).
# Copy to /etc/nginx/sites-available/ada, replace ai.example.edu, link it
# into sites-enabled and reload nginx. Certificates: certbot --nginx.

server {
    listen 80;
    listen [::]:80;
    server_name ai.example.edu;

    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ai.example.edu;

    ssl_certificate /etc/letsencrypt/live/ai.example.edu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ai.example.edu/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    root /var/www/ada/public;
    index index.php;
    charset utf-8;
    server_tokens off;

    # Chat attachments are at most 5 MB (images; ADA_ATTACHMENT_MAX_IMAGE_MB),
    # logos 1 MB. Keep in step with upload_max_filesize/post_max_size.
    client_max_body_size 8m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Built assets have content hashes in their names.
    location /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass unix:/run/php/php8.4-fpm-ada.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;

        # Response headers include the asset preload links and the security
        # policy: more than nginx's default 4-8 KB.
        fastcgi_buffer_size 32k;
        fastcgi_buffers 16 16k;

        # Chat answers are streamed (server-sent events). The response says
        # X-Accel-Buffering: no; answers may take up to the provider timeout
        # (ADA_PROVIDER_TIMEOUT, 300 s) plus margin.
        fastcgi_read_timeout 420s;
    }

    location ~ \.php$ { return 404; }

    location ~ /\.(?!well-known) { deny all; }
}
