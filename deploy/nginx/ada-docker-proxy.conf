# Host nginx in front of the Ada Docker container (compose.production.yml
# publishes it on 127.0.0.1:8080). Terminates HTTPS and passes the client
# address and scheme on; the container trusts them (TRUSTED_PROXIES).

server {
    listen 80;
    listen [::]:80;
    server_name ai.example.edu;

    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ai.example.edu;

    ssl_certificate /etc/letsencrypt/live/ai.example.edu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ai.example.edu/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    server_tokens off;

    client_max_body_size 4m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Streamed chat answers (X-Accel-Buffering: no is honoured as well).
        proxy_buffering off;
        proxy_read_timeout 420s;
    }
}
