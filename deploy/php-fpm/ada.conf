; PHP-FPM pool for Ada Chat (docs/deployment.md, "Sizing").
; Copy to /etc/php/8.4/fpm/pool.d/ada.conf and restart php8.4-fpm.

[ada]
user = www-data
group = www-data
listen = /run/php/php8.4-fpm-ada.sock
listen.owner = www-data
listen.group = www-data

; Every streaming chat answer holds one worker until it ends: allow the
; answers you expect at the busiest moment plus about 10 for page requests.
; Each worker needs roughly 40-60 MB of memory.
pm = dynamic
pm.max_children = 32
pm.start_servers = 8
pm.min_spare_servers = 4
pm.max_spare_servers = 12
pm.max_requests = 1000

php_admin_value[memory_limit] = 256M
php_admin_value[upload_max_filesize] = 2M
php_admin_value[post_max_size] = 8M
php_admin_flag[expose_php] = off
; Production: compiled code is not re-checked; reload PHP-FPM after every
; upgrade (docs/deployment.md, "Upgrading").
php_admin_value[opcache.validate_timestamps] = 0
php_admin_value[opcache.memory_consumption] = 192
php_admin_value[opcache.max_accelerated_files] = 20000
