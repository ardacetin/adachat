name: tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      # MySQL 8.4 LTS is the only supported database; tests never use SQLite.
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: ada_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: ada_test
      DB_USERNAME: root
      DB_PASSWORD: root

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          extensions: intl, mbstring, pdo_mysql
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm

      - name: Install PHP dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Install Node dependencies
        run: npm ci

      - name: Build assets
        run: npm run build

      - name: Bundle size budget
        run: npm run bundle:check

      - name: PHP code style (Pint)
        run: composer lint:check

      - name: PHP static analysis (Larastan)
        run: composer types:check

      - name: Frontend lint and format
        run: npm run check

      - name: TypeScript
        run: npm run types:check

      - name: No hard-coded UI text
        run: npm run i18n:check

      - name: Tests (Pest, MySQL)
        run: php artisan test

      - name: Dependency audit
        run: |
          composer audit
          npm audit --audit-level=moderate

  e2e:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: ada_e2e
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      APP_ENV: local
      ADA_DEV_LOGIN: 'true'
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: ada_e2e
      DB_USERNAME: root
      DB_PASSWORD: root

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          extensions: intl, mbstring, pdo_mysql
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: |
          composer install --no-interaction --no-progress --prefer-dist
          npm ci

      - name: Prepare application
        run: |
          cp .env.example .env
          php artisan key:generate
          npm run build
          php artisan migrate:fresh --seed --force
          php tests/e2e/seed.php

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Playwright
        run: npm run test:e2e

      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  docker:
    # Builds the production image and runs it with compose.production.yml
    # the way an institution would (docs/deployment.md).
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure
        run: |
          cp deploy/env.production.example .env
          sed -i \
            -e "s|^APP_KEY=.*|APP_KEY=base64:$(openssl rand -base64 32)|" \
            -e "s|^APP_URL=.*|APP_URL=http://localhost:8080|" \
            -e "s|^DB_PASSWORD=.*|DB_PASSWORD=$(openssl rand -hex 16)|" \
            -e "s|^SESSION_SECURE_COOKIE=.*|SESSION_SECURE_COOKIE=false|" \
            .env

      - name: Build and start
        run: docker compose -f compose.production.yml up -d --build --wait --wait-timeout 300

      - name: Smoke test
        run: |
          set -euo pipefail
          compose="docker compose -f compose.production.yml"

          curl -fsS http://localhost:8080/up > /dev/null
          curl -fsS -D headers.txt http://localhost:8080/ -o landing.html
          grep -qi '^content-security-policy:' headers.txt
          if grep -qi '^x-powered-by:' headers.txt; then echo 'X-Powered-By leaks the PHP version'; exit 1; fi

          asset=$(grep -o '/build/assets/[^"]*\.js' landing.html | sed -n 1p)
          test -n "$asset"
          curl -fsS -D asset-headers.txt "http://localhost:8080$asset" -o /dev/null
          grep -qi '^cache-control:.*immutable' asset-headers.txt

          # An 11 MB upload passes nginx and PHP and is stopped by the CSRF
          # check (419), not by a body size limit (413).
          head -c 11000000 /dev/zero > upload.bin
          status=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/octet-stream' --data-binary @upload.bin http://localhost:8080/chat/attachments)
          test "$status" = 419 || { echo "Large upload answered $status"; exit 1; }

          $compose exec -T app php artisan ada:install
          # Captured first: grep -q would close the pipe while artisan writes.
          migrations=$($compose exec -T app php artisan migrate:status)
          echo "$migrations" | grep -q Ran

          # The scheduler container leaves a heartbeat within about a minute.
          # (The doctor itself fails here: no identity provider is set up.)
          for i in $(seq 1 24); do
            report=$($compose exec -T app php artisan ada:doctor --no-ansi || true)
            if echo "$report" | grep -Eq 'Scheduler ran in the last 5 minutes.*OK'; then
              echo 'Scheduler is running.'
              exit 0
            fi
            sleep 5
          done
          echo 'The scheduler did not run.'
          $compose exec -T app php artisan ada:doctor --no-ansi || true
          exit 1

      - name: Logs
        if: failure()
        run: docker compose -f compose.production.yml logs --no-color

      - name: Stop
        if: always()
        run: docker compose -f compose.production.yml down -v
